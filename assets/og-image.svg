<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="72%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#12203f"/>
      <stop offset="45%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#c9cfe0"/>
      <stop offset="45%" stop-color="#8a93ad"/>
      <stop offset="72%" stop-color="#3c455f"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#5aa9ff" stop-opacity="0"/>
      <stop offset="94%" stop-color="#6fb4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6fb4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb24d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb24d"/>
      <stop offset="100%" stop-color="#33d6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#core)"/>

  <!-- sparse stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.4" opacity="0.8"/>
    <circle cx="300" cy="180" r="1" opacity="0.5"/>
    <circle cx="80" cy="360" r="1.2" opacity="0.6"/>
    <circle cx="240" cy="470" r="1" opacity="0.5"/>
    <circle cx="520" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="470" cy="520" r="1.3" opacity="0.7"/>
    <circle cx="900" cy="70" r="1" opacity="0.5"/>
    <circle cx="1120" cy="470" r="1.2" opacity="0.6"/>
    <circle cx="1050" cy="560" r="1" opacity="0.45"/>
  </g>

  <!-- planet -->
  <g transform="translate(940 315)">
    <circle r="250" fill="url(#atmo)"/>
    <circle r="205" fill="url(#planet)"/>
    <!-- faint maria shading -->
    <ellipse cx="-42" cy="-28" rx="60" ry="46" fill="#2c3344" opacity="0.28"/>
    <ellipse cx="30" cy="40" rx="42" ry="34" fill="#2c3344" opacity="0.22"/>
    <circle r="205" fill="#04060f" opacity="0.0"/>
  </g>

  <!-- text block -->
  <g transform="translate(90 250)">
    <text font-family="'Barlow Condensed','Arial Narrow',sans-serif" letter-spacing="6"
          font-size="22" fill="#33d6ff" opacity="0.9">SPACE TOURISM &#8226; EST. 2026</text>
    <text y="92" font-family="Bellefair,Georgia,serif" font-size="96" fill="#ffffff"
          letter-spacing="2">Stellar Voyages</text>
    <rect x="2" y="118" width="120" height="3" fill="url(#rule)"/>
    <text y="170" font-family="Barlow,Helvetica,Arial,sans-serif" font-size="30"
          fill="#d0d6f9" opacity="0.92">Your gateway to the stars.</text>
    <text y="234" font-family="'Barlow Condensed','Arial Narrow',sans-serif" letter-spacing="5"
          font-size="24" fill="#ffb24d">MOON &#8226; MARS &#8226; EUROPA &#8226; TITAN</text>
  </g>
</svg>
